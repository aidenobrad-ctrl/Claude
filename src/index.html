<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Halcyon Roads: an open-world festival racing game that runs in the browser.">
<title>Halcyon Roads</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f17;color:#eef2f7;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#ui{position:absolute;inset:0;pointer-events:none}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.2em;opacity:.7}
</style>
</head>
<body>
<div id="app"><canvas id="view" tabindex="0"></canvas><div id="ui"><div id="boot">LOADING</div></div></div>
<!--APP_SCRIPT-->
</body>
</html>
